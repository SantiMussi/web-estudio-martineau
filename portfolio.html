<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio completo de obras realizadas por MartinEau Studio.">
  <title>Obras Realizadas — MartinEau Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header y Navegación -->
  <header class="site-header" id="header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="MartinEau Studio - Ir al inicio">MartinEau</a>
      <nav class="main-nav" aria-label="Navegación principal">
        <ul class="nav-list">
          <li><a href="index.html#nosotros" class="nav-link">Nosotros</a></li>
          <li><a href="catalogo.html" class="nav-link">Catálogo</a></li>
          <li><a href="portfolio.html" class="nav-link">Portfolio</a></li>
          <li><a href="index.html#contacto" class="nav-link">Contacto</a></li>
        </ul>
      </nav>
      <button class="nav-toggle" aria-label="Abrir menú de navegación" aria-expanded="false">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </div>
    <nav class="mobile-nav" aria-label="Navegación móvil" aria-hidden="true">
      <ul class="mobile-nav-list">
        <li><a href="index.html#nosotros" class="mobile-nav-link">Nosotros</a></li>
        <li><a href="catalogo.html" class="mobile-nav-link">Catálogo</a></li>
        <li><a href="portfolio.html" class="mobile-nav-link">Portfolio</a></li>
        <li><a href="index.html#contacto" class="mobile-nav-link">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Secundario -->
  <section class="hero-secondary" style="background-image: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1600&q=80');">
    <div class="hero-secondary-overlay"></div>
    <div class="hero-secondary-content container">
      <h1 class="reveal">Obras Realizadas</h1>
      <p class="reveal">Proyectos que transforman espacios</p>
    </div>
  </section>

  <!-- Portfolio -->
  <section class="portfolio section page-portfolio" id="portfolio-page">
    <div class="container">
      
      <!-- Filtros -->
      <div class="filters reveal">
        <button class="filter-btn active" data-filter="all">Todos</button>
        <button class="filter-btn" data-filter="residencial">Residencial</button>
        <button class="filter-btn" data-filter="corporativo">Corporativo</button>
        <button class="filter-btn" data-filter="publico">Espacio Público</button>
        <button class="filter-btn" data-filter="gastronomia">Gastronomía</button>
      </div>

      <div class="portfolio-masonry filter-container" id="portfolio-grid" data-per-page="6">
        
        <figure class="portfolio-item portfolio-item--tall filter-item" data-category="residencial">
          <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800&q=80" alt="Residencia" loading="lazy">
          <figcaption class="portfolio-overlay">
            <h3 class="portfolio-title">Residencia Montaña</h3>
            <p class="portfolio-context">Residencial — 2024</p>
          </figcaption>
        </figure>

        <figure class="portfolio-item filter-item" data-category="corporativo">
          <img src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=600&q=80" alt="Corporativo" loading="lazy">
          <figcaption class="portfolio-overlay">
            <h3 class="portfolio-title">Torre Madero</h3>
            <p class="portfolio-context">Corporativo — 2024</p>
          </figcaption>
        </figure>

        <figure class="portfolio-item filter-item" data-category="residencial">
          <img src="https://images.unsplash.com/photo-1565793298595-6a879b1d9492?w=600&q=80" alt="Loft" loading="lazy">
          <figcaption class="portfolio-overlay">
            <h3 class="portfolio-title">Loft Palermo</h3>
            <p class="portfolio-context">Residencial — 2023</p>
          </figcaption>
        </figure>

        <figure class="portfolio-item portfolio-item--tall filter-item" data-category="publico">
          <img src="https://images.unsplash.com/photo-1544967882-a350434262e8?w=800&q=80" alt="Espacio Público" loading="lazy">
          <figcaption class="portfolio-overlay">
            <h3 class="portfolio-title">Jardín Escultórico</h3>
            <p class="portfolio-context">Espacio Público — 2023</p>
          </figcaption>
        </figure>

        <figure class="portfolio-item filter-item" data-category="residencial">
          <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600&q=80" alt="Residencia" loading="lazy">
          <figcaption class="portfolio-overlay">
            <h3 class="portfolio-title">Suite Nordelta</h3>
            <p class="portfolio-context">Residencial — 2023</p>
          </figcaption>
        </figure>

        <figure class="portfolio-item filter-item" data-category="publico">
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&q=80" alt="Plaza" loading="lazy">
          <figcaption class="portfolio-overlay">
            <h3 class="portfolio-title">Plaza del Arte</h3>
            <p class="portfolio-context">Espacio Público — 2022</p>
          </figcaption>
        </figure>

        <figure class="portfolio-item filter-item" data-category="gastronomia">
          <img src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=600&q=80" alt="Gastronomía" loading="lazy">
          <figcaption class="portfolio-overlay">
            <h3 class="portfolio-title">Restaurante Austral</h3>
            <p class="portfolio-context">Gastronomía — 2022</p>
          </figcaption>
        </figure>
        
        <figure class="portfolio-item filter-item" data-category="corporativo">
          <img src="https://images.unsplash.com/photo-1565793298595-6a879b1d9492?w=600&q=80" alt="Hotel" loading="lazy">
          <figcaption class="portfolio-overlay">
            <h3 class="portfolio-title">Hotel Boutique</h3>
            <p class="portfolio-context">Corporativo — 2021</p>
          </figcaption>
        </figure>

        <figure class="portfolio-item portfolio-item--tall filter-item" data-category="residencial">
          <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?w=800&q=80" alt="Casa" loading="lazy">
          <figcaption class="portfolio-overlay">
            <h3 class="portfolio-title">Casa del Lago</h3>
            <p class="portfolio-context">Residencial — 2021</p>
          </figcaption>
        </figure>
        
        <figure class="portfolio-item filter-item" data-category="gastronomia">
          <img src="https://images.unsplash.com/photo-1544967882-a350434262e8?w=600&q=80" alt="Bar" loading="lazy">
          <figcaption class="portfolio-overlay">
            <h3 class="portfolio-title">Lounge Bar</h3>
            <p class="portfolio-context">Gastronomía — 2020</p>
          </figcaption>
        </figure>

      </div>

      <!-- Paginación -->
      <div class="pagination reveal" id="pagination-controls-portfolio">
        <!-- Generado por JS -->
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-copy">&copy; 2024 MartinEau Studio. Todos los derechos reservados.</p>
      <p class="footer-credit">Diseño y desarrollo con pasión artesanal.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
