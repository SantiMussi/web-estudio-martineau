<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Panel de Administración — MartinEau</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos rápidos para la interfaz del Dashboard */
        .admin-container {
            padding: 8rem 2rem 4rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 4rem;
            margin-top: 2rem;
        }

        .form-box {
            background: var(--color-bg-alt);
            padding: 2rem;
            border: 1px solid var(--color-border);
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .item-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--color-bg-alt);
            padding: 1rem;
            border: 1px solid var(--color-border);
        }

        .item-card img {
            width: 50px;
            height: 50px;
            object-fit: cover;
        }

        .btn-delete {
            background: #ff4757;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="admin-container">
        <h1>Panel de Control (Mockup Local)</h1>

        <div class="admin-grid">
            <!-- Formulario para Agregar -->
            <div class="form-box">
                <h3>Agregar Producto</h3>
                <form id="add-product-form" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
                    <input type="text" id="prod-titulo" placeholder="Título (ej: Modelo Atria)" required
                        class="form-input">
                    <select id="prod-categoria" class="form-input" style="background: #000; color: #fff;">
                        <option value="chimeneas">Chimeneas</option>
                        <option value="esculturas">Esculturas</option>
                    </select>
                    <input type="url" id="prod-imagen" placeholder="URL de imagen (Unsplash)" required
                        class="form-input">
                    <textarea id="prod-desc" placeholder="Descripción breve" class="form-input"></textarea>
                    <button type="submit" class="btn">Guardar Producto</button>
                </form>
            </div>

            <!-- Listado de elementos cargados -->
            <div>
                <h3>Productos en Sistema</h3>
                <div id="admin-product-list" class="item-list" style="margin-top: 1rem;"></div>
            </div>
        </div>
    </div>

    <script src="admin-store.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await DB.init();
            renderProducts();

            // Manejar envío del formulario
            document.getElementById('add-product-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const newProduct = {
                    titulo: document.getElementById('prod-titulo').value,
                    categoria: document.getElementById('prod-categoria').value,
                    imagen: document.getElementById('prod-imagen').value,
                    descripcion: document.getElementById('prod-desc').value
                };

                DB.add('productos', newProduct);
                e.target.reset();
                renderProducts();
            });
        });

        function renderProducts() {
            const list = document.getElementById('admin-product-list');
            const { productos } = DB.get();

            list.innerHTML = productos.map(p => `
        <div class="item-card">
          <img src="${p.imagen}" alt="${p.titulo}">
          <div>
            <strong>${p.titulo}</strong>
            <p style="font-size:0.8rem; color: gray;">${p.categoria}</p>
          </div>
          <button class="btn-delete" onclick="deleteProduct(${p.id})">Borrar</button>
        </div>
      `).join('');
        }

        function deleteProduct(id) {
            DB.delete('productos', id);
            renderProducts();
        }

        function resetDatabase() {
            if (confirm('¿Estás seguro de que querés borrar todos los cambios locales y recargar desde data.json?')) {
                localStorage.removeItem('martineau_db');
                alert('Base de datos reseteada. Redirigiendo al inicio...');
                window.location.href = '../index.html';
            }
        }
    </script>
</body>

</html>
