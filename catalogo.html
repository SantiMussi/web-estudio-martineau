  <!-- Hero Secundario -->

  <!-- Catálogo -->
  <section class="catalog section page-catalog" id="catalogo-page">

      <div class="filters reveal" id="catalog-filters">

        <button class="filter-btn active" data-filter="all">Todas</button>

      <!-- Grid: se rellena dinámicamente por JS -->

      <!-- Paginación -->
      <div class="pagination reveal" id="pagination-controls">
        <!-- Generado por JS -->
      </div>

    </div>
  </section>

  <!-- Footer -->

    </div>

  <!-- Store compartido (capa de datos / simulación) -->
  <script src="store.js?v=2"></script>

  <script>
    /**
     * ── catalogo.html: lógica de render ──
     *
     * Esta sección NO necesita modificarse al conectar un backend real.
     * Solo cambiá Store.getProductos() en store.js.
     */
    document.addEventListener('DOMContentLoaded', async () => {
      // Inicializa el store (solo necesario mientras se use la simulación)
      await Store.init();
      renderCatalogo();
    });

    function renderCatalogo() {
      const grid = document.getElementById('catalog-grid');
      const filterContainer = document.getElementById('catalog-filters');

      // ── Obtiene las categorías de tipo producto ──
      const categorias = Store.getCategorias('producto');
      if (filterContainer && categorias.length > 0) {
        filterContainer.innerHTML = '<button class="filter-btn active" data-filter="all">Todas</button>' +
          categorias.map(cat => `<button class="filter-btn" data-filter="${cat.slug}">${capitalizar(cat.nombre)}</button>`).join('');
      }

      // ── Obtiene los datos (de simulación o API, según store.js) ──
      const productos = Store.getProductos();

      if (productos.length === 0) {
        grid.innerHTML = '<p style="color:var(--color-text-muted); text-align:center; padding: 3rem 0;">No hay productos disponibles.</p>';
        return;
      }

      // ── forEach: construye una tarjeta por cada producto ──
      grid.innerHTML = productos.map(producto => `
        <a href="producto?id=${producto.id}" class="product-card filter-item" data-category="${producto.categoria}">
          <div class="product-image-wrapper">
            <img src="${producto.imagen}" alt="${producto.titulo}">
          </div>
          <div class="product-body">
            <span class="product-category">${capitalizar(producto.categoria)}</span>
            <h3 class="product-title">${producto.titulo}</h3>
          </div>
        </a>
      `).join('');

      // Reinicializar las animaciones para los elementos recién creados
      if (window.initScrollReveal) window.initScrollReveal();

      // Re-inicializa los filtros y la paginación del script principal
      if (typeof initFilters === 'function') initFilters();
      if (typeof initPagination === 'function') initPagination();
    }

    function capitalizar(str) {
      return str ? str.charAt(0).toUpperCase() + str.slice(1) : '';
    }
  </script>

  <script src="script.js?v=2"></script>
</body>

</html>
