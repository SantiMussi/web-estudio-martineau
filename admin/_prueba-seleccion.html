<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><link rel="stylesheet" href="admin.css?v=12"></head>
<body><main class="admin-main">
<input data-buscar-tabla="sortable-productos" placeholder="buscar">
<select data-filtro-categoria="sortable-productos"><option value="">Todas</option><option value="1">Cat 1</option><option value="2">Cat 2</option></select>
<form method="POST" action="#" id="form-seleccion" class="barra-seleccion" data-seleccion="sortable-productos" hidden>
<span class="barra-seleccion-cuenta" data-seleccion-cuenta></span>
<button type="submit" name="accion" value="ocultar" class="btn-admin btn-secondary btn-sm">Ocultar</button></form>
<table class="admin-table"><thead><tr><th class="col-check"><input type="checkbox" data-seleccion-todos="sortable-productos"></th><th>T</th></tr></thead>
<tbody id="sortable-productos"></tbody></table></main>
<script>
const tb=document.getElementById('sortable-productos');
for(let i=1;i<=75;i++){tb.insertAdjacentHTML('beforeend',`<tr data-id="${i}" data-categoria-id="${i%3===0?2:1}"><td class="col-check"><input type="checkbox" name="items[]" value="${i}" form="form-seleccion"></td><td class="table-title">Pieza ${i}</td></tr>`);}
</script>
<script src="admin.js?v=22"></script></body></html>
